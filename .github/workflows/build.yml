name: Build Android APK (احتساب ناصبیت)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Choose build variant'
        required: true
        default: 'all_apk'
        type: choice
        options:
          - all_apk
          - debug_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🟩 Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📜 Accept Android SDK Licenses & Prepare Environment
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b6492d368297b41e97d19024f2b1d3d63e" >> "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo "d975f751698a77b662f1254ddbeed3901e1a16db" >> "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          echo "601085b94cd77f6b54b86eebd7773a237e2ee46f" >> "$ANDROID_HOME/licenses/google-gdk-license"

          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: 📦 Install npm dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 🏗️ Build Web Assets (Vite)
        run: |
          npm run build

      - name: 🛡️ Ensure Android Native Files & Manifest Exist
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Ensure AndroidManifest.xml exists
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            cat << 'EOF' > android/app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">
        <activity
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation"
            android:name=".MainActivity"
            android:label="@string/title_activity_main"
            android:theme="@style/AppTheme.NoActionBarLaunch"
            android:launchMode="singleTask"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">
            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/file_paths" />
        </provider>
    </application>
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
</manifest>
EOF
            echo "✅ Created missing AndroidManifest.xml"
          fi

          # Ensure variables.gradle exists
          if [ ! -f android/variables.gradle ]; then
            cat << 'EOF' > android/variables.gradle
ext {
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    coreSplashScreenVersion = '1.0.1'
    androidxFragmentVersion = '1.8.9'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '10.1.1'
}
EOF
            echo "✅ Created missing variables.gradle"
          fi

          # Ensure splash.xml exists
          if [ ! -f android/app/src/main/res/drawable/splash.xml ]; then
            cat << 'EOF' > android/app/src/main/res/drawable/splash.xml
<?xml version="1.0" encoding="utf-8"?>
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="@color/colorPrimary"/>
</layer-list>
EOF
            echo "✅ Created missing splash.xml"
          fi

          # Ensure launcher icons exist
          if [ -f public/icon-192.png ]; then
            for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp public/icon-192.png android/app/src/main/res/mipmap-$dir/ic_launcher.png 2>/dev/null || true
              cp public/icon-192.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png 2>/dev/null || true
            done
            echo "✅ Populated mipmap launcher icons"
          fi

          # Ensure proguard-rules.pro exists
          touch android/app/proguard-rules.pro

          # Fix cordova version to valid 10.1.1 on Maven Central
          sed -i "s/cordovaAndroidVersion = '14.0.1'/cordovaAndroidVersion = '10.1.1'/g" android/variables.gradle 2>/dev/null || true
          sed -i "s/cordovaAndroidVersion : '14.0.1'/cordovaAndroidVersion : '10.1.1'/g" android/capacitor-cordova-android-plugins/build.gradle 2>/dev/null || true
          sed -i "s/cordovaAndroidVersion : '14.0.1'/cordovaAndroidVersion : '10.1.1'/g" android/capacitor-cordova-android-plugins/cordova.variables.gradle 2>/dev/null || true

          # Safely bypass unused empty cordova plugin project
          sed -i "s/implementation project(':capacitor-cordova-android-plugins')/\/\/ implementation project(':capacitor-cordova-android-plugins')/g" android/app/build.gradle 2>/dev/null || true
          sed -i "s/include ':capacitor-cordova-android-plugins'/\/\/ include ':capacitor-cordova-android-plugins'/g" android/settings.gradle 2>/dev/null || true

      - name: 🔄 Sync Capacitor Android
        run: |
          npx cap sync android

      - name: 🔑 Make Gradle wrapper executable
        run: |
          chmod +x android/gradlew

      - name: 🚀 Compile Android APK via Gradle
        run: |
          cd android
          echo "=== Building Debug APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

          if [ "${{ github.event.inputs.build_variant }}" != "debug_only" ]; then
            echo "=== Building Release APK (Debug-signed for direct mobile installation) ==="
            ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m" || echo "Release build skipped or completed with warnings"
          fi
          cd ..

      - name: 📁 Collect & Organize Output APKs
        run: |
          mkdir -p output/apk

          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/apk/Ihtisab-e-Nasbiyat-Debug.apk
            echo "✅ Found Debug APK"
          fi

          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/apk/Ihtisab-e-Nasbiyat-Release.apk
            echo "✅ Found Release APK"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/apk/Ihtisab-e-Nasbiyat-Release-unsigned.apk
            echo "✅ Found Unsigned Release APK"
          fi

          echo "=== Generated Files in output/apk ==="
          ls -lh output/apk/
          sha256sum output/apk/*.apk || true

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ihtisab-e-Nasbiyat-APK
          path: output/apk/*.apk
          retention-days: 30

      - name: 📋 Build Summary Report
        run: |
          echo "### 🎉 Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | احتساب ناصبیت (Ihtisab-e-Nasbiyat) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | \`com.ehtisab.nasbiyat\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java Version** | 21 (Temurin JDK) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gradle Version** | 8.14.3 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android SDK** | 35 (Android 15) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📲 How to install:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the \`Ihtisab-e-Nasbiyat-APK\` zip from Artifacts below." >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the zip file on your computer or phone." >> $GITHUB_STEP_SUMMARY
          echo "3. Tap \`Ihtisab-e-Nasbiyat-Debug.apk\` to install directly on any Android device." >> $GITHUB_STEP_SUMMARY
